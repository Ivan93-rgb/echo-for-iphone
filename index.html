<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Голосовой повторитель</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VoiceLooper">
    
    <style>
        :root {
            --bg: #0a0a1a;
            --bg-card: #111128;
            --bg-meter: #1a1a3e;
            --text: #ffffff;
            --text-secondary: #888;
            --text-muted: #444;
            --border: #333;
            --accent: #667eea;
            --accent2: #764ba2;
            --shadow: rgba(102, 126, 234, 0.3);
            --log-bg: rgba(10, 10, 26, 0.8);
            --slider-bg: #1a1a3e;
            --badge-listening: #1a2a4a;
            --badge-recording: #4a1a1a;
            --badge-playing: #1a4a2a;
            --badge-idle: #222;
            --recording-bg: #2e0a0a;
            --active-bg: #1a0a2e;
            --threshold-low: #2ecc71;
            --threshold-mid: #f1c40f;
            --threshold-high: #e74c3c;
            --btn-stop: #e74c3c;
            --btn-stop-bg: rgba(231, 76, 60, 0.2);
        }

        [data-theme="light"] {
            --bg: #f0f0f5;
            --bg-card: #ffffff;
            --bg-meter: #ddd;
            --text: #1a1a2e;
            --text-secondary: #555;
            --text-muted: #999;
            --border: #ccc;
            --accent: #5a4fcf;
            --accent2: #6c3b9e;
            --shadow: rgba(90, 79, 207, 0.3);
            --log-bg: rgba(240, 240, 245, 0.9);
            --slider-bg: #ddd;
            --badge-listening: #e0e7ff;
            --badge-recording: #ffe0e0;
            --badge-playing: #e0ffe0;
            --badge-idle: #eee;
            --recording-bg: #f5e0e0;
            --active-bg: #e8e0f5;
            --btn-stop: #c0392b;
            --btn-stop-bg: rgba(192, 57, 43, 0.15);
        }

        [data-theme="dark"] {
            --bg: #0a0a1a;
            --bg-card: #111128;
            --bg-meter: #1a1a3e;
            --text: #ffffff;
            --text-secondary: #888;
            --text-muted: #444;
            --border: #333;
            --accent: #667eea;
            --accent2: #764ba2;
            --shadow: rgba(102, 126, 234, 0.3);
            --log-bg: rgba(10, 10, 26, 0.8);
            --slider-bg: #1a1a3e;
            --badge-listening: #1a2a4a;
            --badge-recording: #4a1a1a;
            --badge-playing: #1a4a2a;
            --badge-idle: #222;
            --recording-bg: #2e0a0a;
            --active-bg: #1a0a2e;
            --btn-stop: #e74c3c;
            --btn-stop-bg: rgba(231, 76, 60, 0.2);
        }

        [data-theme="neon"] {
            --bg: #0a0a0a;
            --bg-card: #1a0033;
            --bg-meter: #2a004a;
            --text: #00ffcc;
            --text-secondary: #66ffdd;
            --text-muted: #44aa99;
            --border: #00ffcc;
            --accent: #ff00ff;
            --accent2: #00ffff;
            --shadow: rgba(255, 0, 255, 0.4);
            --log-bg: rgba(0, 0, 0, 0.8);
            --slider-bg: #2a004a;
            --badge-listening: #1a004a;
            --badge-recording: #4a001a;
            --badge-playing: #001a4a;
            --badge-idle: #1a1a1a;
            --recording-bg: #2a000a;
            --active-bg: #0a002a;
            --btn-stop: #ff4444;
            --btn-stop-bg: rgba(255, 68, 68, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background 0.4s, color 0.4s;
        }
        body.active { background: var(--active-bg); }
        body.recording { background: var(--recording-bg); }

        .container { max-width: 420px; width: 100%; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 5px; }
        .subtitle { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }

        .status-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 15px auto;
            background: var(--bg-meter);
            border: 3px solid var(--border);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        body.active .status-circle { border-color: var(--accent); box-shadow: 0 0 40px var(--shadow); }
        body.recording .status-circle { border-color: var(--threshold-high); box-shadow: 0 0 40px rgba(231,76,60,0.4); animation: pulse 0.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        #status { font-size: 18px; color: var(--text-secondary); min-height: 30px; margin-top: 10px; }
        #volume { font-size: 14px; color: var(--accent); margin-top: 5px; }

        .meter {
            width: 100%;
            height: 6px;
            margin: 15px 0;
            background: var(--bg-meter);
            border-radius: 10px;
            overflow: hidden;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.08s;
        }

        .visualizer {
            width: 100%;
            height: 60px;
            background: var(--bg-meter);
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            padding: 4px 8px;
            transition: background 0.3s;
            border: 1px solid var(--border);
        }
        .visualizer-bar {
            flex: 1;
            height: 4px;
            min-height: 4px;
            background: linear-gradient(180deg, var(--accent), var(--accent2));
            border-radius: 2px;
            transition: height 0.08s;
        }

        .settings {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            width: 100%;
            transition: background 0.3s;
            border: 1px solid var(--border);
        }
        .settings-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
        }
        .settings-title .value { color: var(--accent); font-weight: bold; }

        .slider-group { margin: 10px 0; }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .slider-group label .val { color: var(--accent); font-weight: bold; }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 10px;
            background: var(--slider-bg);
            outline: none;
            transition: background 0.3s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            cursor: pointer;
            box-shadow: 0 0 20px var(--shadow);
        }
        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: none;
        }

        .slider-scale {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 2px;
            padding: 0 2px;
        }
        .slider-scale .low { color: var(--threshold-low); }
        .slider-scale .mid { color: var(--threshold-mid); }
        .slider-scale .high { color: var(--threshold-high); }

        .presets {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .preset-btn {
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        .preset-btn:active { transform: scale(0.95); }
        .preset-btn.active {
            border-color: var(--accent);
            background: rgba(102, 126, 234, 0.2);
            color: var(--accent);
        }

        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .badge.idle { background: var(--badge-idle); color: var(--text-secondary); }
        .badge.listening { background: var(--badge-listening); color: var(--accent); }
        .badge.recording { background: var(--badge-recording); color: var(--threshold-high); }
        .badge.playing { background: var(--badge-playing); color: var(--threshold-low); }

        .log {
            margin-top: 12px;
            font-size: 10px;
            color: var(--text-muted);
            max-height: 50px;
            overflow-y: auto;
            width: 100%;
            text-align: left;
            background: var(--log-bg);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            line-height: 1.6;
            transition: background 0.3s, color 0.3s;
        }
        .log-entry { padding: 1px 0; border-bottom: 1px solid var(--border); }
        .log-entry .time { color: var(--text-muted); }

        .info {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.6;
            width: 100%;
            text-align: center;
        }

        .threshold-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding: 6px 12px;
            background: var(--log-bg);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 12px;
            flex-wrap: wrap;
            justify-content: center;
            transition: background 0.3s, border 0.3s;
        }
        .threshold-indicator .label { color: var(--text-secondary); }
        .threshold-indicator .current { color: var(--threshold-low); font-weight: bold; }
        .threshold-indicator .threshold { color: var(--threshold-high); font-weight: bold; }

        .btn-main {
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-main:active { transform: scale(0.95); }
        .btn-main.running { background: linear-gradient(135deg, var(--btn-stop), #c0392b); }

        .theme-buttons {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin: 10px 0;
            flex-wrap: wrap;
        }
        .theme-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .theme-btn:active { transform: scale(0.95); }
        .theme-btn.active {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(102, 126, 234, 0.15);
        }
    </style>
</head>
<body id="body" data-theme="dark">
    <div class="container">
        <h1>🎤 Голосовой повторитель</h1>
        <div class="subtitle">Говорите — услышите себя с задержкой</div>

        <div class="status-circle" id="circle">🎙️</div>
        <div id="status">Нажмите "Старт"</div>
        <div id="volume">Громкость: 0</div>

        <div class="meter">
            <div class="meter-fill" id="meterFill"></div>
        </div>

        <div class="visualizer" id="visualizer"></div>

        <div class="threshold-indicator">
            <span class="label">📊 Уровень:</span>
            <span class="current" id="currentLevel">0</span>
            <span class="label">→ Порог:</span>
            <span class="threshold" id="thresholdLevel">25</span>
        </div>

        <span class="badge idle" id="badge">● Ожидание</span>
        <button class="btn-main" id="startBtn">▶ Старт</button>

        <div class="theme-buttons">
            <button class="theme-btn active" data-theme="dark">🌙 Тёмная</button>
            <button class="theme-btn" data-theme="light">☀️ Светлая</button>
            <button class="theme-btn" data-theme="neon">💜 Неон</button>
        </div>

        <div class="settings">
            <div class="settings-title">
                <span>⚙️ Настройки</span>
                <span class="value" id="thresholdDisplay">Порог: 25</span>
            </div>

            <!-- ГРОМКОСТЬ ВОСПРОИЗВЕДЕНИЯ (НОВЫЙ СЛАЙДЕР) -->
            <div class="slider-group">
                <label>
                    <span>🔊 Громкость воспроизведения</span>
                    <span class="val" id="gainValue">200%</span>
                </label>
                <input type="range" id="gainSlider" min="50" max="400" value="200" step="5">
                <div class="slider-scale">
                    <span>50%</span>
                    <span>200%</span>
                    <span>400%</span>
                </div>
            </div>

            <div class="slider-group">
                <label>
                    <span>Чувствительность</span>
                    <span class="val" id="thresholdValue">25</span>
                </label>
                <input type="range" id="thresholdSlider" min="5" max="100" value="25" step="1">
                <div class="slider-scale">
                    <span class="low">5 (шёпот)</span>
                    <span class="mid">50</span>
                    <span class="high">100 (громко)</span>
                </div>
            </div>

            <div class="slider-group" style="margin-top:12px;">
                <label>
                    <span>Задержка (сек)</span>
                    <span class="val" id="delayValue">3</span>
                </label>
                <input type="range" id="delaySlider" min="0.5" max="10" value="3" step="0.5">
                <div class="slider-scale">
                    <span>0.5с</span>
                    <span>5с</span>
                    <span>10с</span>
                </div>
            </div>

            <div class="presets">
                <button class="preset-btn" data-threshold="60" data-delay="3" data-gain="200">🔇 Шумно</button>
                <button class="preset-btn active" data-threshold="25" data-delay="3" data-gain="200">🎯 Средняя</button>
                <button class="preset-btn" data-threshold="12" data-delay="3" data-gain="250">🗣️ Шёпот</button>
                <button class="preset-btn" data-threshold="40" data-delay="5" data-gain="200">🎵 Музыка</button>
                <button class="preset-btn" data-threshold="80" data-delay="3" data-gain="150">📢 Крик</button>
            </div>
        </div>

        <div class="log" id="log">
            <div class="log-entry"><span class="time">▶</span> Приложение запущено</div>
        </div>

        <div class="info">
            <span>Говорите для записи · Автоотключение через 1.5 сек тишины</span>
        </div>
    </div>

    <script>
        // ===================== СОХРАНЕНИЕ НАСТРОЕК =====================
        const STORAGE_KEY = 'voice_looper_settings';

        function loadSettings() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const settings = JSON.parse(saved);
                    if (settings.threshold) VOICE_THRESHOLD = settings.threshold;
                    if (settings.delay) DELAY_SECONDS = settings.delay;
                    if (settings.gain) PLAYBACK_GAIN = settings.gain;
                    if (settings.theme) {
                        document.body.setAttribute('data-theme', settings.theme);
                        updateThemeButtons(settings.theme);
                    }
                    return true;
                }
            } catch (e) { console.warn('Ошибка загрузки', e); }
            return false;
        }

        function saveSettings() {
            try {
                const settings = {
                    threshold: VOICE_THRESHOLD,
                    delay: DELAY_SECONDS,
                    gain: PLAYBACK_GAIN,
                    theme: document.body.getAttribute('data-theme') || 'dark'
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
            } catch (e) { console.warn('Ошибка сохранения', e); }
        }

        // ===================== ПЕРЕМЕННЫЕ =====================
        let VOICE_THRESHOLD = 25;
        let DELAY_SECONDS = 3;
        let PLAYBACK_GAIN = 200; // % громкости (100 = обычная)
        const SILENCE_TIMEOUT = 1.5;
        const MIN_RECORDING_SECONDS = 0.3;

        let isRunning = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationFrame = null;
        let stream = null;
        let lastSoundTime = 0;
        let isRecording = false;
        let isPlaying = false;
        let recordingStartTime = 0;
        let currentVolume = 0;
        let isProcessing = false;

        // DOM
        const body = document.body;
        const circle = document.getElementById('circle');
        const statusDiv = document.getElementById('status');
        const volumeDiv = document.getElementById('volume');
        const meterFill = document.getElementById('meterFill');
        const visualizer = document.getElementById('visualizer');
        const badge = document.getElementById('badge');
        const logDiv = document.getElementById('log');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValue = document.getElementById('thresholdValue');
        const thresholdDisplay = document.getElementById('thresholdDisplay');
        const thresholdLevel = document.getElementById('thresholdLevel');
        const currentLevel = document.getElementById('currentLevel');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const gainSlider = document.getElementById('gainSlider');
        const gainValue = document.getElementById('gainValue');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const startBtn = document.getElementById('startBtn');
        const themeBtns = document.querySelectorAll('.theme-btn');

        // ===================== UI =====================
        function updateThresholdDisplay() {
            thresholdValue.textContent = VOICE_THRESHOLD;
            thresholdDisplay.textContent = `Порог: ${VOICE_THRESHOLD}`;
            thresholdLevel.textContent = VOICE_THRESHOLD;
        }

        function updateDelayDisplay() {
            delayValue.textContent = DELAY_SECONDS;
        }

        function updateGainDisplay() {
            gainValue.textContent = PLAYBACK_GAIN + '%';
            gainSlider.value = PLAYBACK_GAIN;
        }

        function updateVolumeDisplay(volume) {
            currentVolume = Math.round(volume);
            currentLevel.textContent = currentVolume;
            volumeDiv.textContent = `Громкость: ${currentVolume} (порог: ${VOICE_THRESHOLD})`;
            const fill = document.querySelector('.meter-fill');
            if (currentVolume >= VOICE_THRESHOLD) {
                fill.style.background = `linear-gradient(90deg, var(--threshold-low), var(--threshold-mid))`;
            } else {
                fill.style.background = `linear-gradient(90deg, var(--accent), var(--accent2))`;
            }
        }

        // ===== ВИЗУАЛИЗАТОР =====
        let visualizerBars = [];

        function initVisualizer() {
            visualizer.innerHTML = '';
            const count = 24;
            for (let i = 0; i < count; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar';
                visualizer.appendChild(bar);
                visualizerBars.push(bar);
            }
        }
        initVisualizer();

        function updateVisualizer(volume) {
            const normalized = Math.min(1, volume / 255);
            const count = visualizerBars.length;
            for (let i = 0; i < count; i++) {
                const distance = Math.abs(i - count / 2) / (count / 2);
                const factor = Math.max(0, 1 - distance * 0.7);
                const barHeight = 4 + normalized * factor * 56;
                visualizerBars[i].style.height = barHeight + 'px';
                if (volume > VOICE_THRESHOLD) {
                    visualizerBars[i].style.background = `linear-gradient(180deg, var(--threshold-high), var(--threshold-mid))`;
                } else {
                    visualizerBars[i].style.background = `linear-gradient(180deg, var(--accent), var(--accent2))`;
                }
            }
        }

        function addLog(msg) {
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `<span class="time">${time}</span> ${msg}`;
            logDiv.prepend(entry);
            if (logDiv.children.length > 30) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }

        function updateUI(state, statusText) {
            body.className = '';
            switch (state) {
                case 'listening':
                    body.classList.add('active');
                    circle.textContent = '🎤';
                    badge.className = 'badge listening';
                    badge.textContent = '● Слушаю';
                    startBtn.textContent = '⏹ Остановить';
                    startBtn.className = 'btn-main running';
                    break;
                case 'recording':
                    body.classList.add('recording');
                    circle.textContent = '🔴';
                    badge.className = 'badge recording';
                    badge.textContent = '● Запись';
                    break;
                case 'playing':
                    body.classList.add('active');
                    circle.textContent = '🔊';
                    badge.className = 'badge playing';
                    badge.textContent = '● Воспроизведение';
                    break;
                default:
                    circle.textContent = '🎙️';
                    badge.className = 'badge idle';
                    badge.textContent = '● Ожидание';
                    startBtn.textContent = '▶ Старт';
                    startBtn.className = 'btn-main';
                    break;
            }
            statusDiv.textContent = statusText;
        }

        // ===== ТЕМЫ =====
        function updateThemeButtons(theme) {
            themeBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === theme);
            });
        }

        themeBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const theme = this.dataset.theme;
                body.setAttribute('data-theme', theme);
                updateThemeButtons(theme);
                saveSettings();
                addLog(`🎨 Тема: ${this.textContent.trim()}`);
            });
        });

        // ===== ЗАПУСК =====
        function startApp() {
            if (isRunning) {
                stopEverything();
                return;
            }

            addLog('🚀 Запуск...');
            updateUI('idle', '🎵 Инициализация...');

            try {
                audioContext = new(window.AudioContext || window.webkitAudioContext)();

                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        addLog('✅ Аудио активировано');
                        startMicrophone();
                    }).catch(err => {
                        addLog('⚠️ ' + err.message);
                        document.addEventListener('touchstart', function onTouch() {
                            document.removeEventListener('touchstart', onTouch);
                            if (audioContext && audioContext.state === 'suspended') {
                                audioContext.resume().then(() => {
                                    addLog('✅ Аудио активировано');
                                    startMicrophone();
                                });
                            } else {
                                startMicrophone();
                            }
                        }, { once: true });
                        updateUI('idle', '👆 Коснитесь экрана');
                    });
                } else {
                    startMicrophone();
                }
            } catch (err) {
                addLog('❌ ' + err.message);
                updateUI('idle', '❌ Ошибка');
            }
        }

        function startMicrophone() {
            addLog('🎤 Запрос микрофона...');

            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    }
                })
                .then(s => {
                    stream = s;
                    addLog('✅ Микрофон получен');
                    startListening();
                })
                .catch(err => {
                    addLog('❌ Ошибка микрофона: ' + err.message);
                    updateUI('idle', '❌ Нет доступа к микрофону');
                    setTimeout(() => {
                        if (!isRunning) {
                            startBtn.textContent = '▶ Попробовать снова';
                            startBtn.className = 'btn-main';
                        }
                    }, 1000);
                });
        }

        // ===== ПРОСЛУШКА =====
        function startListening() {
            if (isRunning) return;
            if (!stream) {
                startMicrophone();
                return;
            }

            try {
                if (!audioContext || audioContext.state === 'closed') {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') audioContext.resume();
                }

                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                try {
                    mediaRecorder = new MediaRecorder(stream);
                } catch (e) {
                    mediaRecorder = new MediaRecorder(stream);
                }

                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    const duration = (Date.now() - recordingStartTime) / 1000;
                    if (audioChunks.length > 0 && duration >= MIN_RECORDING_SECONDS && !isPlaying && !isProcessing) {
                        addLog(`📼 Запись ${duration.toFixed(1)}с`);
                        playRecording();
                    } else {
                        audioChunks = [];
                        isRecording = false;
                        if (isRunning) {
                            updateUI('listening', '🎤 Слушаю...');
                        }
                    }
                };

                isRunning = true;
                lastSoundTime = Date.now();
                updateUI('listening', '🎤 Слушаю...');
                addLog('🎧 Прослушка активна');
                checkVolume();

            } catch (err) {
                addLog('❌ Ошибка: ' + err.message);
                stopEverything();
            }
        }

        // ===== АНАЛИЗ ГРОМКОСТИ =====
        function checkVolume() {
            if (!isRunning || !analyser) return;

            try {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                let volume = sum / dataArray.length;

                updateVolumeDisplay(volume);
                updateVisualizer(volume);

                const percent = Math.min(100, (volume / 255) * 100);
                meterFill.style.width = percent + '%';

                const now = Date.now();

                if (volume > VOICE_THRESHOLD) {
                    lastSoundTime = now;

                    if (!isRecording && mediaRecorder && mediaRecorder.state === 'inactive' && !isPlaying && !isProcessing) {
                        audioChunks = [];
                        mediaRecorder.start();
                        isRecording = true;
                        recordingStartTime = now;
                        updateUI('recording', '🔴 Запись...');
                        addLog(`🔴 Запись (громкость ${Math.round(volume)})`);
                    }
                } else {
                    if (isRecording && mediaRecorder) {
                        const silenceDuration = (now - lastSoundTime) / 1000;
                        if (silenceDuration > SILENCE_TIMEOUT) {
                            mediaRecorder.stop();
                            updateUI('listening', '⏸ Тишина...');
                            addLog(`⏸ Тишина ${silenceDuration.toFixed(1)}с`);
                        }
                    }
                }

                animationFrame = requestAnimationFrame(checkVolume);

            } catch (err) {
                addLog('⚠️ ' + err.message);
                stopEverything();
            }
        }

        // ===== ВОСПРОИЗВЕДЕНИЕ С УСИЛЕНИЕМ =====
        function playRecording() {
            if (isProcessing || isPlaying) return;

            isProcessing = true;
            isPlaying = true;
            updateUI('playing', `⏳ Через ${DELAY_SECONDS}с...`);
            addLog(`⏳ Задержка ${DELAY_SECONDS}с (громкость ${PLAYBACK_GAIN}%)`);

            const chunksCopy = audioChunks.slice();
            audioChunks = [];
            isRecording = false;

            setTimeout(() => {
                if (chunksCopy.length === 0) {
                    isProcessing = false;
                    isPlaying = false;
                    if (isRunning) {
                        updateUI('listening', '🎤 Слушаю...');
                    }
                    return;
                }

                if (!audioContext || audioContext.state === 'closed') {
                    audioContext = new(window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        doPlay(chunksCopy);
                    }).catch(err => {
                        addLog('❌ Ошибка контекста: ' + err.message);
                        isProcessing = false;
                        isPlaying = false;
                        if (isRunning) updateUI('listening', '🎤 Слушаю...');
                    });
                } else {
                    doPlay(chunksCopy);
                }

            }, DELAY_SECONDS * 1000);
        }

        function doPlay(chunks) {
            try {
                let mimeType = 'audio/webm';
                if (chunks[0] && chunks[0].type) {
                    mimeType = chunks[0].type;
                }

                const blob = new Blob(chunks, { type: mimeType });
                const url = URL.createObjectURL(blob);

                fetch(url)
                    .then(response => response.arrayBuffer())
                    .then(arrayBuffer => {
                        URL.revokeObjectURL(url);
                        return audioContext.decodeAudioData(arrayBuffer);
                    })
                    .then(audioBuffer => {
                        // === УСИЛЕНИЕ ГРОМКОСТИ ===
                        const gainValue = PLAYBACK_GAIN / 100; // 2.0 для 200%
                        const gainNode = audioContext.createGain();
                        gainNode.gain.value = gainValue;

                        const source = audioContext.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(gainNode);
                        gainNode.connect(audioContext.destination);

                        updateUI('playing', `🔊 Воспроизведение (${PLAYBACK_GAIN}%)...`);
                        addLog(`🔊 Воспроизведение (усиление ${PLAYBACK_GAIN}%)`);

                        source.onended = () => {
                            addLog('✅ Воспроизведение завершено');
                            isPlaying = false;
                            isProcessing = false;
                            if (isRunning) {
                                updateUI('listening', '🎤 Слушаю...');
                                addLog('🎤 Снова слушаю');
                            }
                        };

                        source.start(0);

                        setTimeout(() => {
                            if (isPlaying) {
                                try { source.stop(); } catch (e) {}
                                isPlaying = false;
                                isProcessing = false;
                                if (isRunning) {
                                    updateUI('listening', '🎤 Слушаю...');
                                }
                            }
                        }, (audioBuffer.duration * 1000) + 1000);
                    })
                    .catch(err => {
                        addLog('❌ Ошибка декодирования: ' + err.message);
                        // Fallback на Audio с увеличенной громкостью
                        try {
                            const blob2 = new Blob(chunks, { type: 'audio/mp4' });
                            const url2 = URL.createObjectURL(blob2);
                            const audio = new Audio();
                            audio.src = url2;
                            audio.volume = Math.min(1, PLAYBACK_GAIN / 100);
                            audio.onended = () => {
                                URL.revokeObjectURL(url2);
                                isPlaying = false;
                                isProcessing = false;
                                if (isRunning) updateUI('listening', '🎤 Слушаю...');
                            };
                            audio.onerror = () => {
                                URL.revokeObjectURL(url2);
                                addLog('❌ Ошибка Audio элемента');
                                isPlaying = false;
                                isProcessing = false;
                                if (isRunning) updateUI('listening', '🎤 Слушаю...');
                            };
                            audio.play();
                        } catch (e2) {
                            addLog('❌ ' + e2.message);
                            isPlaying = false;
                            isProcessing = false;
                            if (isRunning) updateUI('listening', '🎤 Слушаю...');
                        }
                    });

            } catch (err) {
                addLog('❌ ' + err.message);
                isPlaying = false;
                isProcessing = false;
                if (isRunning) updateUI('listening', '🎤 Слушаю...');
            }
        }

        // ===== ОСТАНОВКА =====
        function stopEverything() {
            addLog('⏹ Остановка');

            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
                animationFrame = null;
            }

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.stop(); } catch (e) {}
            }

            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }

            if (audioContext && audioContext.state !== 'closed') {
                try { audioContext.close(); } catch (e) {}
                audioContext = null;
            }

            isRunning = false;
            isRecording = false;
            isPlaying = false;
            isProcessing = false;
            audioChunks = [];

            visualizerBars.forEach(bar => bar.style.height = '4px');

            updateUI('idle', '⏹ Остановлено');
            volumeDiv.textContent = 'Громкость: 0';
            meterFill.style.width = '0%';
            currentLevel.textContent = '0';
            addLog('⏹ Остановлено');
        }

        // ===== СОБЫТИЯ =====

        startBtn.addEventListener('click', startApp);

        // Новый слайдер громкости воспроизведения
        gainSlider.addEventListener('input', function() {
            PLAYBACK_GAIN = parseInt(this.value);
            updateGainDisplay();
            saveSettings();
            addLog(`🔊 Громкость воспроизведения: ${PLAYBACK_GAIN}%`);
        });

        thresholdSlider.addEventListener('input', function() {
            VOICE_THRESHOLD = parseInt(this.value);
            updateThresholdDisplay();
            presetBtns.forEach(b => b.classList.remove('active'));
            saveSettings();
            addLog(`🎛️ Чувствительность: ${VOICE_THRESHOLD}`);
        });

        delaySlider.addEventListener('input', function() {
            DELAY_SECONDS = parseFloat(this.value);
            updateDelayDisplay();
            saveSettings();
            addLog(`⏱️ Задержка: ${DELAY_SECONDS}с`);
        });

        presetBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const threshold = parseInt(this.dataset.threshold);
                const delay = parseFloat(this.dataset.delay);
                const gain = parseInt(this.dataset.gain) || 200;
                
                VOICE_THRESHOLD = threshold;
                DELAY_SECONDS = delay;
                PLAYBACK_GAIN = gain;
                
                thresholdSlider.value = threshold;
                delaySlider.value = delay;
                gainSlider.value = gain;
                
                updateThresholdDisplay();
                updateDelayDisplay();
                updateGainDisplay();
                
                presetBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                saveSettings();
                addLog(`🎯 Пресет: ${this.textContent.trim()}`);
            });
        });

        // ===== ЗАГРУЗКА =====
        window.addEventListener('load', () => {
            addLog('🚀 Загружено');
            const hasSettings = loadSettings();
            if (hasSettings) {
                thresholdSlider.value = VOICE_THRESHOLD;
                delaySlider.value = DELAY_SECONDS;
                gainSlider.value = PLAYBACK_GAIN;
                updateThresholdDisplay();
                updateDelayDisplay();
                updateGainDisplay();
                addLog('💾 Настройки загружены');
            }
            setTimeout(startApp, 1000);
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && !isRunning) {
                addLog('🔄 Возврат');
                setTimeout(startApp, 500);
            }
        });

        window.onerror = function(msg) {
            addLog('❌ ' + msg);
            return false;
        };
    </script>
</body>
</html>
